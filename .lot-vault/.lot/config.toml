# <vault>/.lot/config.toml — this vault's own config.
#
# Overrides the user config (~/.config/lot/config.toml) field-by-field for
# whoever opens this vault. Only `[[update-types]]`, `[thing]`, and a narrow
# `[tui]` (theme + keybindings, but NOT the vault list) are meaningful here.

# ── Update types ────────────────────────────────────────────────────────────
#
# The typed updates `lot update <name>` can create. Each type has a name plus
# two flags: takes-body (does it accept a body; default true) and terminal
# (does it retire the Thing; default false). This list *is* the vault's set of
# types — edit, remove, or add entries freely. Names: lowercase letters,
# digits, and hyphens, starting with a letter; `path` is reserved.

[[update-types]]
name = "note"

[[update-types]]
name = "work"

[[update-types]]
name = "info"

[[update-types]]
name = "done"
takes-body = false
terminal = true

# ── Thing creation ──────────────────────────────────────────────────────────
#
# The type `lot thing new` writes as a Thing's first update (must be one of
# the types above).
[thing]
default-update-type = "note"

# ── Front-end (TUI) overrides ───────────────────────────────────────────────
#
# Optional. Anything set here overrides the user config's `[tui]` while this
# vault is active. A vault may override `theme` and `keybindings` but NOT the
# vault-switcher list (a `[[tui.vaults]]` here is a hard error). Uncomment to
# use:
#
# [tui]
# theme = "gruvbox"
#
# [tui.keybindings]
# quit = "Q"
